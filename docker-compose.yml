# Production.
#
# Différences volontaires avec docker-compose.dev.yml :
#   - volume de base distinct (taskins-db-prod) : réinitialiser la base de
#     développement ne peut jamais détruire les données de production ;
#   - pas de bind mount du code : l'image contient une copie figée au moment du
#     build, insensible à ce qui arrive ensuite dans le répertoire ;
#   - pas de --reload : une erreur de syntaxe dans un fichier n'arrête pas le
#     service en cours d'exécution ;
#   - INSTALL_DEV absent : pytest et ses dépendances ne sont pas dans l'image.
#
# Le port peut être surchargé par TASKINS_HTTP_PORT (voir README).

services:
  taskins:
    build:
      context: .
      args:
        # Proxy d'entreprise : nécessaire au `pip install` pendant le build.
        # Sans ces arguments, le build échoue sur un réseau filtré.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: taskins-app
    env_file: .env.prod
    ports:
      - "${TASKINS_HTTP_PORT:-80}:8000"
    volumes:
      - taskins-db:/app/data
      - ./secrets:/app/secrets:ro
    networks:
      - taskins-net
    restart: unless-stopped

volumes:
  taskins-db:
    name: taskins-db-prod

networks:
  taskins-net:
    name: taskins-net
