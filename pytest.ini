[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short

# Ajoute la racine du projet à sys.path pour que `import taskins` fonctionne.
# Sans cette ligne, `pytest` échoue (ModuleNotFoundError) alors que
# `python -m pytest` passe : cette seconde forme ajoute le répertoire courant
# à sys.path, la première non.
pythonpath = .
